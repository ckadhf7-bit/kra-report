<meta name="robots" content="noindex">

/* Layout: 폰 한 칸 세로 스크롤, 상단 탭 4개, 요약 먼저 → 표. 이 파일은 tools/publish_site.py 가 자료를 넣어 site/index.html 로 만든다. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#17211b; --muted:#5d6b62; --line:#dbe2dc;
  --accent:#1f6b4a; --accent-soft:#dcefe5; --on-accent:#ffffff; --bad:#b3342b; --bad-soft:#f8e1de; --warn-bg:#fff4d6; --warn-fg:#6b4a00;
  --font:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1612; --surface:#17211b; --fg:#e6ece8; --muted:#9aa89f; --line:#2a3a31;
  --accent:#58c28f; --accent-soft:#1d3a2c; --on-accent:#0f1612; --bad:#f07a70; --bad-soft:#3a1f1c; --warn-bg:#3a3018; --warn-fg:#f1d58a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:12px 14px;font-size:14px}
.warnbox b{display:block;margin-bottom:2px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;font:inherit;font-size:14px;font-weight:500;border:0;background:none;color:var(--muted);padding:9px 2px;border-radius:7px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:12px 0 4px;color:var(--muted);font-weight:500}
h3:first-of-type{margin-top:0}
.verdict{background:var(--accent-soft);border-color:transparent}
.verdict p{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.neg{color:var(--bad)} .pos{color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.pick{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pick:last-child{border-bottom:0}
.pick .d{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.none{color:var(--muted);font-size:14px;padding:2px 0}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;white-space:nowrap;font-weight:500}
.chip.hit{background:var(--accent-soft);color:var(--accent)} .chip.miss{background:var(--bad-soft);color:var(--bad)} .chip.wait{background:var(--line);color:var(--fg)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:52px 1fr 78px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar .t{height:10px;background:var(--line);border-radius:5px;position:relative;overflow:hidden}
.bar .f{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar .r{text-align:right;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.log{padding:10px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.vtag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
/* 유력 경주: 큰 카드 */
.hot{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hot .lbl{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.hot .main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hot .no{font-size:15px;font-weight:700;color:var(--accent)}
.hot .nm{font-size:22px;font-weight:700;line-height:1.25}
.hot .probs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hot .probs .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.hot .probs .k{font-size:12px;color:var(--muted)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hot .others{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
/* 전체 경주: 경주마다 1·2·3순위 */
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px}
details.day>summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .s{font-weight:400;font-size:13px;color:var(--muted);margin-left:auto}
details.day>summary::after{content:"\25BE";color:var(--muted);font-weight:400}
details.day[open]>summary::after{content:"\25B4"}
.race{border-top:1px solid var(--line);padding:10px 0}
.race.is-hot{border-left:4px solid var(--accent);background:var(--accent-soft);margin:0 -14px;padding:10px 14px 10px 10px}
.race .rh{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px;gap:8px}
.race .rh b{font-size:14px}
.hr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 0;font-size:14px}
.rk{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--line);color:var(--fg)}
.rk.r1{background:var(--accent);color:var(--on-accent)}
.hr .pp{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;white-space:nowrap}
.hr .pp b{font-size:14px}
.hr .pp span{color:var(--muted)}
.hr .nm2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordc{font-size:11.5px;padding:0 6px;border-radius:99px;margin-left:4px;font-weight:500;background:var(--line)}
.ordc.o1{background:var(--accent);color:var(--on-accent)} .ordc.o23{background:var(--accent-soft);color:var(--accent)}
/* 실시간 착순 */
.livebar{border:2px solid var(--bad);display:flex;flex-direction:column;gap:2px}
.livebar .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.livebar b{color:var(--bad)}
.livebar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.lst{font-size:11.5px;padding:0 7px;border-radius:99px;font-weight:500;white-space:nowrap;background:var(--line);color:var(--fg)}
.lst.fin{background:var(--accent-soft);color:var(--accent)} .lst.pend{background:var(--warn-bg);color:var(--warn-fg)}
</style>
</head>

  var ru=function(m){var r=DATA.meets[m].rule;return r?DATA.meets[m].name+' '+Math.round(r.margin_min*100)+'%p':''};
  var ruleTxt=[ru('1'),ru('2')].filter(Boolean).join(', ');
  if(hots.length){html+='<h2 style="margin:4px 0 -6px">★ 유력 경주</h2>';hots.forEach(function(x){html+=hotCard(x[0].meet,x[0].d,x[1])})}
  if(ruleTxt)html+='<p class="note" style="margin:-6px 0 0">★ 유력 = 1순위와 2순위의 1착 확률 차이가 미리 정한 기준('+ruleTxt+') 이상이고 1순위 말의 과거 출주 기록이 충분한 경주. 과거 평가 구간에서 이런 경주의 1순위 1착 비율은 서울 50%, 제주 58%였습니다(환급률은 100% 미만).</p>';
  html+='<h2 style="margin:4px 0 -6px">다가오는 전체 경주</h2>';
  if(!up.length)html+='<div class="card none">저장된 예측이 없습니다. 주간 갱신(목·월 저녁) 뒤에 다시 확인하세요.</div>';
  up.forEach(function(x,i){
    var nh=x.d.races.filter(function(r){return r.selected}).length;
    html+='<details class="day"'+(i<2||nh?' open':'')+'><summary><span>'+esc(x.meet)+' · '+dlabel(x.d.date)+'</span><span class="s">'+x.d.n_races+'경주'+(nh?' · 유력 '+nh:'')+'</span></summary>'+x.d.races.map(raceBlock).join('')+'</details>';
  });
  var pastDone=past.filter(function(x){return x.d.races.some(function(r){return r.done})});
  html+='<h2 style="margin:4px 0 -6px">최근 결과</h2>';
  if(!pastDone.length)html+='<div class="card none">최근 3주 안에 결과가 반영된 경주가 없습니다. 결과는 주간 갱신(목·월 저녁) 때 들어옵니다.</div>';
  pastDone.forEach(function(x){
    var rs=x.d.races.filter(function(r){return r.done}),w=rs.filter(function(r){return r.top[0].ord===1}).length;
    var hs=rs.filter(function(r){return r.selected}),hw=hs.filter(function(r){return r.top[0].ord===1}).length;
    html+='<details class="day"><summary><span>'+esc(x.meet)+' · '+dlabel(x.d.date)+'</span><span class="s">1순위 1착 '+w+'/'+rs.length+(hs.length?' · 유력 '+hw+'/'+hs.length:'')+'</span></summary>'+rs.map(raceBlock).join('')+'</details>';
  });
  html+='<p class="note">경주 전날까지 저장된 예측만 보여줍니다. 1착 확률은 모델 점수이며 과거 평가 구간에서 실제 1착 비율과 대체로 맞았습니다(예: 30%로 본 말이 약 30% 이겼음). 3착 안 확률은 1착 확률로 계산한 근사치입니다. 표본이 수백 경주 쌓이기 전에는 적중 수를 실력으로 보기 어렵습니다.</p>';
  return html;
}

function meetPanel(m){
  var M=DATA.meets[m],b=M.backtest;
  if(!b)return '<div class="card">백테스트 결과가 없습니다.</div>';
  var rs=b.roi_selected,ra=b.roi_all;
  var bars=b.months.map(function(x){var h=x.hit==null?0:x.hit*100;return '<div class="bar"><span>'+x.m.slice(2,4)+'-'+x.m.slice(4)+'</span><span class="t"><span class="f" style="width:'+h+'%"></span></span><span class="r">'+(x.hit==null?'—':h.toFixed(0)+'%')+' ('+x.n+'건)</span></div>'}).join('');
  var rule=b.rule?'점수 차 '+b.rule.margin_min+' 이상 · 1위 후보 과거 출주 '+b.rule.min_top_prev_runs+'회 이상 · 이력 보유 '+Math.round(b.rule.min_known_share*100)+'% 이상':'없음';
  return '<div class="card verdict"><p><b>적중률은 높지만 돈은 잃었습니다.</b> 모델이 고른 '+b.n_selected+'경주의 단승 적중률은 '+pct(b.selected.rate)+'이지만 확정 배당 기준 환급률은 '+pct(rs&&rs.roi)+'입니다. 전체 적중률('+pct(b.all.rate)+')은 인기 1위마('+pct(b.fav_all&&b.fav_all.rate)+')보다 낮습니다.</p></div>'
  +'<div class="card"><h2>과거 기간 검증 (실사용 모델 '+esc(M.feature_set||DATA.feature_set)+')</h2><p class="note" style="margin:0 0 10px">'+dash(b.period[0])+' ~ '+dash(b.period[1])+' · 평가 '+b.n_races.toLocaleString('ko-KR')+'경주 · 선별 '+b.n_selected+'경주</p><div class="grid2">'
  +'<div class="stat"><div class="k">단승 적중 · 선별</div><div class="v">'+pct(b.selected.rate)+'</div><div class="n">'+b.selected.hits+'/'+b.selected.n+' · 95% '+pct(b.selected.ci[0])+'–'+pct(b.selected.ci[1])+'</div></div>'
  +'<div class="stat"><div class="k">단승 적중 · 전체</div><div class="v">'+pct(b.all.rate)+'</div><div class="n">'+b.all.hits+'/'+b.all.n+'</div></div>'
  +'<div class="stat"><div class="k">환급률 · 선별</div><div class="v '+(rs&&rs.roi<1?'neg':'pos')+'">'+pct(rs&&rs.roi)+'</div><div class="n">'+(rs?won(rs.net)+' ('+rs.bets+'건)':'')+'</div></div>'
  +'<div class="stat"><div class="k">환급률 · 전체</div><div class="v '+(ra&&ra.roi<1?'neg':'pos')+'">'+pct(ra&&ra.roi)+'</div><div class="n">'+(ra?won(ra.net)+' ('+ra.bets.toLocaleString('ko-KR')+'건)':'')+'</div></div>'
  +'</div><p class="note">이미 지난 기간을 다시 계산한 결과라 미래 성적을 보장하지 않습니다.</p></div>'
  +'<div class="card"><h2>기준 비교 (단승)</h2><div class="tablewrap"><table><tr><th>방식</th><th>전체</th><th>선별</th></tr>'
  +'<tr><td>이 모델 1위 후보</td><td>'+pct(b.all.rate)+'</td><td>'+pct(b.selected.rate)+'</td></tr>'
  +'<tr><td>인기 1위(사후 배당)</td><td>'+pct(b.fav_all&&b.fav_all.rate)+'</td><td>'+pct(b.fav_selected&&b.fav_selected.rate)+'</td></tr></table></div>'
  +'<p class="note">인기 1위는 경주 후 확정 배당이 가장 낮은 말입니다.</p></div>'
  +'<div class="card"><h2>월별 선별 경주 단승 적중</h2><div class="bars">'+bars+'</div><p class="note">월별 건수가 적어 한 달 수치로 판단하기 어렵습니다.</p></div>'
  +'<div class="card"><h2>선별 규칙</h2><p style="margin:0">'+rule+'</p><p class="note">모델 '+esc(b.model)+' · 과거 조정 기간에서 정한 뒤 고정했습니다.</p></div>';
}

function logPanel(){
  var rows=DATA.history.map(function(h){
    var cur=/실사용/.test(h.version);
    return '<tr><td>'+(cur?'<b>'+esc(h.version)+'</b>':esc(h.version))+'</td><td>'+pct(h.seoul_all)+'</td><td>'+pct(h.seoul_roi)+'</td><td>'+pct(h.jeju_all)+'</td><td>'+pct(h.jeju_roi)+'</td></tr>';
  }).join('');
  var fav1=DATA.meets['1'].backtest,fav2=DATA.meets['2'].backtest;
  rows+='<tr><td>인기 1위(사후)</td><td>'+pct(fav1&&fav1.fav_all&&fav1.fav_all.rate)+'</td><td>—</td><td>'+pct(fav2&&fav2.fav_all&&fav2.fav_all.rate)+'</td><td>—</td></tr>';
  var logs=DATA.changelog.map(function(e){
    return '<div class="log"><div><span class="vtag">'+esc(e.version)+'</span> <b>'+esc(e.title)+'</b></div><div class="note" style="margin:2px 0 0">'+esc(e.at)+'</div>'
      +(e.details.length?'<ul>'+e.details.map(function(d){return '<li>'+esc(d)+'</li>'}).join('')+'</ul>':'')+'</div>';
  }).join('');
  return '<div class="card"><h2>버전별 성과 추이</h2><div class="tablewrap"><table><tr><th>버전</th><th>서울 전체 적중</th><th>서울 선별 환급률</th><th>제주 전체 적중</th><th>제주 선별 환급률</th></tr>'+rows+'</table></div>'
    +'<p class="note">단승 기준, 같은 과거 평가 기간. v1~v2.1은 자료 재정제 전 수치입니다. 선별 환급률은 100~250건 표본이라 변동이 큽니다.</p></div>'
    +'<div class="card"><h2>업데이트 히스토리</h2>'+logs+'</div>';
}

function show(t){
  var tabs=['week','1','2','log'];
  if(tabs.indexOf(t)<0)t='week';
  tabs.forEach(function(k){document.getElementById('p-'+k).hidden=(k!==t);document.getElementById('tab-'+k).setAttribute('aria-selected',k===t?'true':'false')});
}
var g=new Date(DATA.generated_at);
var mv=DATA.models||{};
document.getElementById('meta').innerHTML='<span class="vtag">앱 '+esc(DATA.app_version)+'</span> '+(g.getMonth()+1)+'/'+g.getDate()+' '+String(g.getHours()).padStart(2,'0')+':'+String(g.getMinutes()).padStart(2,'0')+' 갱신'
  +(mv['1']?' · 모델 '+esc(mv['1'].version):'');
document.getElementById('p-week').innerHTML=weekPanel();
document.getElementById('p-1').innerHTML=meetPanel('1');
document.getElementById('p-2').innerHTML=meetPanel('2');
document.getElementById('p-log').innerHTML=logPanel();
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){var t=b.dataset.tab;show(t);try{history.replaceState(null,'',t==='week'?location.pathname:'#'+t)}catch(e){}})});
window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
show(location.hash.slice(1));
loadLive();
setInterval(loadLive,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadLive()});
</script>
</body>
</html>
